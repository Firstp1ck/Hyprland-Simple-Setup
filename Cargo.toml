[package]
name = "hyprland_setup_tui"
version = "0.5.0"
edition = "2024"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[dependencies]
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
anyhow = "1"
which = "8.0.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

