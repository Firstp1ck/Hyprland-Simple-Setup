[pyprland]
plugins = [
    "scratchpads",
    "expose",
    "shift_monitors",
    #    "workspaces_follow_focus"
]

[scratchpads.term]
animation = "fromTop"
command = "alacritty --class=alacritty.term-top"
class = "alacritty.term-top"
size = "75% 60%"
max_size = "1920px 100%"
margin = 50
unfocus = "hide"

[scratchpads.volume]
animation = "fromRight"
command = "pavucontrol"
class = "org.pulseaudio.pavucontrol"
size = "40% 30%"
position = "59% 4%"
unfocus = "hide"
lazy = true