# Pyprland scratchpads window rules
# These explicit window rules are needed for pyprland scratchpads to work correctly
# Windows must be set to float for pyprland to control positioning and animation
windowrule = float on, match:class alacritty.term-top
windowrule = float on, match:class org.pulseaudio.pavucontrol

# Workspace rules
# Intentionally left empty in the example.
# During setup, `setup.sh` may inject a browser workspace rule here based on your browser choice.

# Workspace 1

# Ignore maximize requests from apps. You'll probably like this.
# Note: suppressevent may not be available in v0.53.0 - check documentation
# windowrule = suppressevent fullscreenoutput, match:class ^(.*)$

# Fix some dragging issues with XWayland
windowrule = stay_focused off, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# XWayland video bridge window rules
windowrule = opacity 0.0 override, match:class xwaylandvideobridge
windowrule = no_anim on, match:class xwaylandvideobridge
windowrule = stay_focused off, match:class xwaylandvideobridge
# Note: maxsize may not be available in v0.53.0 - check documentation
# windowrule = maxsize 1 1, match:class xwaylandvideobridge
windowrule = no_blur on, match:class xwaylandvideobridge
windowrule = stay_focused off, match:class xwaylandvideobridge

# Note: org.pulseaudio.pavucontrol float rule is above for pyprland scratchpad
# center rule removed to allow pyprland to control positioning

windowrule = float on, match:class blueman-manager
windowrule = center on, match:class blueman-manager

windowrule = float on, match:class nm-connection-editor
windowrule = center on, match:class nm-connection-editor

windowrule = float on, match:class org.qbittorrent.qBittorrent
windowrule = center on, match:class org.qbittorrent.qBittorrent

windowrule = float on, match:class input-remapper-gtk
windowrule = center on, match:class input-remapper-gtk

windowrule = float on, match:class waypaper
windowrule = center on, match:class waypaper

windowrule = float on, match:class org.kde.filelight
windowrule = center on, match:class org.kde.filelight

windowrule = float on, match:class GParted

windowrule = float on, match:class polychromatic
windowrule = center on, match:class polychromatic

windowrule = float on, match:class Tk
windowrule = center on, match:class Tk

windowrule = float on, match:class Tor Browser

windowrule = float on, match:class python3, match:title Tor Browser Launcher Einstellungen

windowrule = float on, match:class filezilla
windowrule = center on, match:class filezilla
windowrule = size 1330 800, match:class filezilla

layerrule = dim_around on, match:namespace wofi

windowrule = float on, match:class qalculate-gtk

windowrule = float on, match:class alacritty, match:title Notes
windowrule = center on, match:class alacritty, match:title Notes

windowrule = float on, match:class org.clipgrab.clipgrab
windowrule = center on, match:class org.clipgrab.clipgrab

windowrule = tile on, match:class libreoffice-calc
windowrule = tile on, match:class libreoffice-writer

windowrule = float on, match:class wshowkeys

windowrule = float on, match:class alacritty, match:title calcurse

windowrule = float on, match:class psensor
windowrule = center on, match:class psensor

windowrule = float on, match:class showmethekey-gtk
windowrule = move 100 100, match:class showmethekey-gtk

windowrule = float on, match:class ^(conky)$
windowrule = stay_focused off, match:class ^(conky)$
windowrule = pin on, match:class ^(conky)$
windowrule = move 20 40, match:class ^(conky)$

