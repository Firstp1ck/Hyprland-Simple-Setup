$terminal = kitty

$multiplex = zellij

$fileManager = dolphin

$menu = wofi --show drun --style ~/.config/wofi/menu.css

$browser = zen-browser
# Alternative browsers:
# $browser = hyprctl dispatch exec "vivaldi-stable --ozone-platform=wayland --enable-features=UseOzonePlatform"
# $browser = qutebrowser
# $browser = firefox

$editor = hyprctl dispatch exec "code --ozone-platform=wayland --enable-features=UseOzonePlatform"
# Alternative editors:
# $editor = nvim
# $editor = cursor --ozone-platform=wayland --enable-features=UseOzonePlatform

# Voice/Communication app (example)
# $voice = discord --enable-features=UseOzonePlatform --ozone-platform=wayland

$screenshot = hyprshot --mode

$cursor = rose-pine-hyprcursor

$colorPicker = hyprpicker --autocopy --format hex

$git = github-desktop

$calc = qalculate-gtk

# Default wallpaper (will be overridden by change_wallpaper.sh)
$wallpaper = ~/Pictures/Wallpapers

$hyprscripts = ~/.config/hypr/scripts

$calendar = $hyprscripts/float_calendar.sh

$wayscripts = ~/.config/waybar/scripts

# Mouse device name (check with: libinput list-devices | grep Device)
# Example: $mouse = "Razer Razer Naga V2 Pro"
$mouse = ""
