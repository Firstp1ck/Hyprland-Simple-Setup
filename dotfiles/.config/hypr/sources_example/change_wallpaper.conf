# Define wallpaper directory
# Example: WALLPAPER_DIR="$HOME/Pictures/Wallpapers"
WALLPAPER_DIR="$HOME/Pictures/Wallpapers"

# Define monitors
# Check monitor names with: hyprctl monitors
# Example: MONITORS=("DP-1" "HDMI-A-1")
# Leave empty and let `setup.sh` (monitor setup) populate this automatically,
# or set it manually if you prefer.
MONITORS=()